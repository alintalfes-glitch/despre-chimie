<!DOCTYPE html>
<html lang="ro" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Postare | ChimieBlog</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Pentru formule chimice complexe, decomentează linia următoare:
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
  -->
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">⚗️ ChimieBlog</a>
      <nav class="main-nav">
        <a href="index.html">Acasă</a>
        <a href="despre.html">Despre</a>
        <a href="archive.html">Arhivă</a>
      </nav>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle" aria-label="Comută tema">🌙</button>
      </div>
    </div>
  </header>

  <main class="container">
    <article id="post-content" class="post-full">
      <p>Încărcare...</p>
    </article>

    <div class="post-navigation">
      <a id="prev-post" class="btn">← Anterioară</a>
      <a id="next-post" class="btn">Următoare →</a>
    </div>

    <button id="share-btn" class="btn share-btn">🔗 Distribuie</button>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 ChimieBlog. Proiect educațional.</p>
    </div>
  </footer>

  <script src="assets/js/posts-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
